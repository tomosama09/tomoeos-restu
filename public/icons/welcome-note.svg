  <path d="M28 42h31M28 50h25M28 58h19" stroke="#2f7fb4" stroke-width="4" stroke-linecap="round" opacity=".7"/>
  <circle cx="65" cy="65" r="14" fill="#44baf2" stroke="#fff" stroke-width="2"/>
  <path d="m65 55 3 6 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1z" fill="#fff5a8" stroke="#fff" stroke-width="1.5"/>
  <path d="M23 16h36" stroke="url(#glass)" stroke-width="5" stroke-linecap="round"/>
