<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="palGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8eb"/>
      <stop offset="100%" stop-color="#e3cb98"/>
    </linearGradient>
    <linearGradient id="brushWood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97724"/>
      <stop offset="100%" stop-color="#8c4109"/>
    </linearGradient>
    <linearGradient id="metalFerrule" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-color="#001830" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Palette Body -->
  <path d="M22,4 C10.95,4 2,12.5 2,23 C2,31 8,37.5 16,39 C17.5,39.28 19,38 19,36.5 C19,35.5 18.5,34.5 18.5,33.5 C18.5,31 20.5,29 23,29 L26,29 C34.8,29 42,21.8 42,13 C42,8 33,4 22,4 Z" fill="url(#palGrad)" stroke="#c4a56b" stroke-width="1.2" filter="url(#dropShadow)"/>

  <!-- Thumb Hole -->
  <ellipse cx="32" cy="18" rx="3.5" ry="5" fill="#f8fafc" stroke="#b0935b" stroke-width="1"/>

  <!-- Paint Blobs -->
  <circle cx="9" cy="16" r="3.2" fill="#ef4444" stroke="#dc2626" stroke-width="0.6"/>
  <circle cx="16" cy="10" r="3" fill="#f59e0b" stroke="#d97706" stroke-width="0.6"/>
  <circle cx="25" cy="9" r="3.2" fill="#eab308" stroke="#ca8a04" stroke-width="0.6"/>
  <circle cx="10" cy="26" r="3.3" fill="#10b981" stroke="#059669" stroke-width="0.6"/>
  <circle cx="15" cy="33" r="2.8" fill="#3b82f6" stroke="#2563eb" stroke-width="0.6"/>
  <circle cx="23" cy="22" r="2.6" fill="#8b5cf6" stroke="#7c3aed" stroke-width="0.6"/>

  <!-- Paint Brush -->
  <g transform="rotate(-35 34 32)" filter="url(#dropShadow)">
    <!-- Wooden Handle -->
    <rect x="33" y="10" width="3" height="26" rx="1.5" fill="url(#brushWood)" stroke="#5c2605" stroke-width="0.5"/>
    <!-- Metal Ferrule -->
    <rect x="32.5" y="36" width="4" height="6" rx="0.5" fill="url(#metalFerrule)" stroke="#64748b" stroke-width="0.5"/>
    <!-- Bristles / Tip with blue paint -->
    <path d="M32.5,42 C32.5,46 34.5,48 34.5,48 C34.5,48 36.5,46 36.5,42 Z" fill="#2563eb" stroke="#1d4ed8" stroke-width="0.5"/>
  </g>
</svg>